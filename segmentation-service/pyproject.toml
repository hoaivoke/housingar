[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-ar-segmentation"
version = "0.1.0"
description = "Local Mac segmentation service for Housing AR"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[project.scripts]
housing-ar-segmentation = "housing_segmentation.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["housing_segmentation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
